<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PinjemDulu - Aplikasi Peminjaman Inventaris Organisasi Kemahasiswaan (OKI) Kampus." />
  <title>PinjemDulu - Inventaris OKI Kampus</title>

  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />

  <!-- Font Poppins Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Token Desain & Stylesheets Tailwind -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-background text-foreground antialiased">
  <!-- Skip link aksesibilitas -->
  <a
    href="#app"
    class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:rounded-xl focus:bg-primary focus:px-4 focus:py-2 focus:text-white focus:shadow-lg focus:outline-none focus:ring-2 focus:ring-ring"
  >
    Lewati ke konten utama
  </a>

  <!-- Root Shell Aplikasi -->
  <div id="shell-root" class="flex min-h-screen w-full bg-zinc-50 text-zinc-900">
    <div id="sidebar-container"></div>
    <div id="content-container" class="flex min-w-0 flex-1 flex-col">
      <div id="navbar-container"></div>
      <main id="app" class="min-w-0 flex-1 p-4 sm:p-7" tabindex="-1"></main>
      <div id="footer-container" class="px-4 pb-4 sm:px-7"></div>
    </div>
  </div>

  <!-- Mobile Drawer Container -->
  <div id="drawer-container"></div>

  <!-- Entry Script ES Module -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
